<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langit Nusantara — Make the best flight game</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a1a26;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #app, #app canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .panel { position: absolute; background: rgba(4,20,28,0.55);
    border: 1px solid rgba(142,245,192,0.45); border-radius: 6px;
    padding: 10px 14px; color: #8ef5c0; }
  .hud-topleft { top: 16px; left: 16px; }
  .hud-topright { top: 16px; right: 16px; text-align: right; }
  .hud-topcenter { top: 16px; left: 50%; transform: translateX(-50%); padding: 6px 10px; }
  .hud-bottomleft { bottom: 16px; left: 16px; }
  .hud-bottomright { bottom: 16px; right: 16px; text-align: center; }
  .hud-label { font-size: 12px; letter-spacing: 2px; color: #8ef5c0; }
  .hud-big { font-size: 44px; font-weight: 700; line-height: 1.05; color: #eafff3;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  .hud-unit { font-size: 11px; letter-spacing: 2px; color: rgba(142,245,192,0.75); }
  .hud-sub { font-size: 14px; color: #cfeede; margin-top: 2px; }
  .fuelbar { width: 190px; height: 8px; background: rgba(255,255,255,0.15);
    border-radius: 4px; margin-top: 6px; overflow: hidden; }
  #hud-fuel-bar { height: 100%; background: #8ef5c0; width: 100%; }
  .thrbar { width: 26px; height: 110px; background: rgba(255,255,255,0.12);
    border-radius: 4px; margin: 6px auto 4px; position: relative; overflow: hidden; }
  #hud-thr-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
    background: #ffd76a; }
  #hud-attitude { bottom: 16px; left: 50%; transform: translateX(-50%);
    padding: 8px 10px 6px; text-align: center; }
  #hud-reticle { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .ret-dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px;
    border-radius: 50%; border: 2px solid rgba(142,245,192,0.9);
    box-shadow: 0 0 8px rgba(142,245,192,0.7); }
  #hud-ringmark { position: absolute; transform: translate(-50%,-50%); display: none;
    text-align: center; }
  .ring-diamond { width: 22px; height: 22px; margin: 0 auto;
    border: 3px solid #ffd76a; transform: rotate(45deg);
    box-shadow: 0 0 12px rgba(255,215,106,0.8); }
  .ring-dist { margin-top: 8px; font-size: 13px; font-weight: 700; color: #ffd76a;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8); }
  #hud-message { position: absolute; top: 24%; left: 50%; transform: translate(-50%,-50%) scale(0.92);
    font-size: 54px; font-weight: 800; letter-spacing: 2px; color: #ffffff;
    text-shadow: 0 2px 22px rgba(0,0,0,0.65); opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease; text-align: center; }
  #hud-message.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .msg-sub { font-size: 20px; font-weight: 400; letter-spacing: 1px; color: #8ef5c0;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7); margin-top: 6px; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; pointer-events: auto;
    background: linear-gradient(rgba(4,16,26,0.22), rgba(4,16,26,0.62)); }
  .ov-inner { text-align: center; max-width: 760px; padding: 40px; color: #eaf6ff; }
  .ov-kicker { letter-spacing: 4px; font-size: 13px; color: #8ef5c0; }
  .ov-inner h1 { font-size: 76px; line-height: 0.95; margin: 14px 0; letter-spacing: 3px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.55); }
  .ov-inner h2 { font-size: 52px; line-height: 1; margin: 14px 0; letter-spacing: 2px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.55); }
  .ov-sub { font-size: 18px; color: #ffd76a; }
  .ov-text { font-size: 17px; line-height: 1.55; color: #d5e8f0; }
  .ov-controls { font-size: 14px; color: #9fc4d8; margin: 20px 0; line-height: 1.7; }
  .ov-button { pointer-events: auto; font-size: 20px; font-weight: 700; letter-spacing: 2px;
    color: #06231a; background: #8ef5c0; border: none; border-radius: 8px;
    padding: 14px 36px; cursor: pointer; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  .ov-button:hover { background: #a8ffce; }
  .ov-foot { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 20px; }
  /* v2: cockpit panel (bottom glareshield bar, shown only in cockpit mode).
     Warm wood-and-brass instruments — dark walnut panel, brass-rimmed
     gauges, amber numerals — so the strip reads as a flown cockpit,
     not a flat black HUD bar. */
  #cockpit-panel { position: absolute; left: 0; right: 0; bottom: 0; display: flex;
    justify-content: center; gap: 12px; padding: 10px 16px 12px;
    background: linear-gradient(rgba(46,33,19,0.96), rgba(23,16,10,0.98));
    border-top: 3px solid rgba(176,141,62,0.85);
    box-shadow: 0 -6px 24px rgba(0,0,0,0.45); pointer-events: none; }
  .ck-gauge { text-align: center; color: #ffd76a; background: rgba(26,18,10,0.75);
    border: 2px solid #b08d3e; border-radius: 8px; padding: 8px 12px 7px;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.6), 0 0 8px rgba(255,183,71,0.25); min-width: 86px; }
  .ck-gauge .hud-big { font-size: 34px; color: #ffe9b8; }
  .ck-gauge .hud-label { font-size: 11px; color: #e8b64c; }
  .ck-gauge .hud-unit { color: rgba(255,183,71,0.75); }
  .ck-gauge .hud-sub { color: #f0d9a0; }
  #cockpit-panel .thrbar { height: 84px; }
  #cockpit-compass { position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(26,18,8,0.6); border: 1px solid rgba(176,141,62,0.6);
    border-radius: 6px; padding: 6px 10px; text-align: center; pointer-events: none; }
  .ck-fuelbar { width: 110px; height: 10px; background: rgba(255,255,255,0.15);
    border-radius: 5px; margin: 8px auto 2px; overflow: hidden; }
  #ck-fuel-bar { height: 100%; background: #ffb347; width: 100%; }
  .ck-gear-dots { display: flex; justify-content: center; gap: 10px; margin: 12px 0 8px; }
  .ck-gear-dots span { width: 15px; height: 15px; border-radius: 50%;
    background: rgba(255,90,78,0.3); border: 1px solid rgba(255,255,255,0.25); }
  .ck-gear-dots span.on { background: #8ef5c0;
    box-shadow: 0 0 10px rgba(142,245,192,0.9); border-color: #8ef5c0; }
  .ck-gear-dots span.off { background: rgba(255,215,106,0.75);
    box-shadow: 0 0 8px rgba(255,215,106,0.6); border-color: #ffd76a; }
  #hud.cockpit-mode .panel { display: none; }
  /* v2: dispatch board + debrief. */
  .dispatch-inner { max-width: 1080px; text-align: left; }
  .dispatch-body { display: flex; gap: 24px; margin-top: 18px; }
  .dispatch-list { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .mission-row { display: flex; gap: 12px; align-items: center; padding: 10px 12px;
    background: rgba(4,20,28,0.6); border: 1px solid rgba(142,245,192,0.35);
    border-radius: 8px; cursor: pointer; pointer-events: auto; }
  .mission-row:hover { border-color: #8ef5c0; background: rgba(4,20,28,0.85); }
  .mission-num { font-size: 26px; font-weight: 800; color: #ffd76a; width: 30px; text-align: center; }
  .mission-main { flex: 1; }
  .mission-name { font-size: 17px; font-weight: 700; letter-spacing: 1px; color: #eafff3; }
  .mission-goal { font-size: 13px; color: #d5e8f0; margin-top: 2px; }
  .mission-meta { font-size: 12px; color: #9fc4d8; margin-top: 2px; }
  .mission-medal { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #ffd76a; }
  .mission-row.done .mission-medal { color: #8ef5c0; }
  .dispatch-map { text-align: center; }
  .dispatch-map canvas { border: 2px solid #b08d3e; border-radius: 4px; background: #e9dec2; }
  .dispatch-map-cap { font-size: 11px; letter-spacing: 2px; color: #d8c08d; margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  .debrief-inner { max-width: 980px; }
  .debrief-body { display: flex; gap: 24px; margin-top: 16px; align-items: flex-start; }
  .debrief-grade { text-align: center; min-width: 150px; }
  #debrief-grade { font-size: 110px; font-weight: 800; line-height: 1; color: #ffd76a;
    text-shadow: 0 4px 30px rgba(0,0,0,0.55); }
  .debrief-grade-cap { font-size: 13px; letter-spacing: 2px; color: #8ef5c0; margin-top: 6px; }
  .debrief-right { flex: 1; }
  #debrief-trace { border: 1px solid rgba(142,245,192,0.35); border-radius: 8px; width: 100%; }
  .debrief-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; margin-top: 12px; }
  .debrief-metrics div { display: flex; justify-content: space-between; font-size: 14px; color: #d5e8f0;
    border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 4px; }
  .debrief-metrics span { letter-spacing: 1px; color: #9fc4d8; font-size: 12px; }
  .debrief-metrics b { color: #eafff3; }
  .ov-button-ghost { background: transparent; color: #8ef5c0; border: 2px solid #8ef5c0; box-shadow: none; }
  #hud.menu-mode .panel { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script src="vendor/three.min.js"></script>
<script src="src/rng.js"></script>
<script src="src/sky.js"></script>
<script src="src/assets.js"></script>
<script src="src/terrain.js"></script>
<script src="src/aircraft.js"></script>
<script src="src/flight.js"></script>
<script src="src/missions.js"></script>
<script src="src/cockpit.js"></script>
<script src="src/interior.js"></script>
<script src="src/dispatch.js"></script>
<script src="src/debrief.js"></script>
<script src="src/hud.js"></script>
<script src="src/sound.js"></script>
<script src="src/game.js"></script>
</body>
</html>
